name: CI

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "model/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "deployment/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "model/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "deployment/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        cache: npm
    - name: Check that the chart and Kustomize versions match package.json
      run: node scripts/check-versions.ts
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Unit and integration tests
      run: npm test
    - name: Install the packed package and run it
      run: |
        npm pack --pack-destination "$RUNNER_TEMP"
        cd "$RUNNER_TEMP"
        npm init -y >/dev/null
        npm install --no-audit --no-fund "$RUNNER_TEMP"/saidsef-aws-kinesis-local-*.tgz
        npx aws-kinesis-local --help
        node --input-type=module -e "
          import { start } from '@saidsef/aws-kinesis-local'
          const server = await start({ port: 0 })
          const response = await fetch(server.endpoint, { method: 'POST', body: '{}', headers: {
            'content-type': 'application/x-amz-json-1.1',
            'x-amz-target': 'Kinesis_20131202.ListStreams',
            authorization: 'AWS4-HMAC-SHA256 Credential=a/b, SignedHeaders=c, Signature=d',
            'x-amz-date': '20260101T000000Z',
          } })
          console.log(response.status, await response.text())
          await server.close()
          if (response.status !== 200) process.exit(1)
        "

  image:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: aws-kinesis-local:ci
      KINESIS_ENDPOINT: http://127.0.0.1:4567
    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        cache: npm
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
    - name: Install test dependencies
      run: |
        npm ci
        python -m pip install -r test/clients/requirements.txt
    - name: Build the image
      run: docker build --build-arg VERSION="$(jq -r .version package.json)" -t "$IMAGE" .
    - name: Start the image
      run: |
        docker run -d --name kinesis -p 4567:4567 -e SHARDLIMIT=1000 "$IMAGE"
        timeout 60 sh -c "until curl -s -o /dev/null $KINESIS_ENDPOINT; do sleep 1; done"
    - name: Test the AWS SDK for JavaScript v3
      run: npm run test:endpoint
    - name: Test the AWS CLI
      run: sh test/clients/aws-cli.sh
    - name: Test boto3
      run: python test/clients/test_boto3.py
    - name: Show the server logs
      if: failure()
      run: docker logs kinesis
    - name: Write the scan report for code scanning
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}
        scanners: vuln,secret
        format: sarif
        output: trivy-results.sarif
    - name: Upload the scan report to code scanning
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: trivy-results.sarif
    - name: Scan the image for high and critical vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}
        scanners: vuln,secret
        severity: HIGH,CRITICAL
        exit-code: "1"
        # The report step already installed Trivy and downloaded its database.
        skip-setup-trivy: true
        cache: false

  build:
    runs-on: ubuntu-latest
    needs: [test, image]
    if: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set Tag Name
      id: tag
      env:
        RAW_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        # Docker image tags cannot contain '/', so replace with '-'.
        TAG="${RAW_REF//\//-}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        {
          echo "TAG=$TAG"
          echo "REPO_NAME=${PWD##*/}"
          echo "VERSION=$(jq -r .version package.json)"
          echo "CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        } >> "$GITHUB_ENV"
    - name: Login to DockerHub
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: arm64
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        build-args: VERSION=${{ env.VERSION }}
        labels: |
          org.opencontainers.image.created=${{ env.CREATED }}
          org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
        platforms: linux/amd64,linux/arm64
        pull: true
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO_NAME }}:${{ env.TAG }}

  k8s-test:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ ! contains(github.ref, 'main') }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Create k8s Kind Cluster
        run: kind create cluster --wait 60s
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the image tag
        run: |
          # GitHub drops a job output that contains a secret, such as the Docker Hub username.
          if [ -z "$TAG" ]; then
            echo "::error::The build job did not return the image tag."
            exit 1
          fi
      - name: Deploy the Kustomize manifests
        env:
          NAMESPACE: kustomize
        run: |
          cp -R deployment "$RUNNER_TEMP/deployment"
          cd "$RUNNER_TEMP/deployment"
          kustomize edit set image "docker.io/saidsef/aws-kinesis-local:$TAG"
          kubectl create namespace "$NAMESPACE"
          kubectl apply --namespace "$NAMESPACE" -k .
          kubectl rollout status statefulset/kinesis --namespace "$NAMESPACE" --timeout 5m
      - name: Install the chart
        run: helm install kinesis charts/kinesis --namespace kinesis --create-namespace --set-string image.tag="$TAG" --wait --timeout 5m
      - name: Test the chart
        run: helm test kinesis --namespace kinesis --timeout 5m
      - name: Show the cluster state
        if: failure()
        run: |
          kubectl get all --all-namespaces
          kubectl describe pods --all-namespaces --selector app.kubernetes.io/name=kinesis
          helm list --all-namespaces

  auto-approve:
    runs-on: ubuntu-latest
    needs: [build, k8s-test]
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
    - name: Auto Approve PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
       script: |
        github.rest.pulls.createReview({
          owner: context.repo.owner,
          repo: context.repo.repo,
          pull_number: context.issue.number,
          event: "APPROVE"
        })

  auto-preview:
    runs-on: ubuntu-latest
    needs: [auto-approve]
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
    - name: Add Preview Label
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['preview']
          })
