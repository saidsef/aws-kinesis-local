name: CI

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "model/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "model/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  REGISTRY: docker.io
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Unit and integration tests
      run: npm test
    - name: Install the packed package and run it
      run: |
        npm pack --pack-destination "$RUNNER_TEMP"
        cd "$RUNNER_TEMP"
        npm init -y >/dev/null
        npm install --no-audit --no-fund "$RUNNER_TEMP"/saidsef-aws-kinesis-local-*.tgz
        npx aws-kinesis-local --help
        node --input-type=module -e "
          import { start } from '@saidsef/aws-kinesis-local'
          const server = await start({ port: 0 })
          const response = await fetch(server.endpoint, { method: 'POST', body: '{}', headers: {
            'content-type': 'application/x-amz-json-1.1',
            'x-amz-target': 'Kinesis_20131202.ListStreams',
            authorization: 'AWS4-HMAC-SHA256 Credential=a/b, SignedHeaders=c, Signature=d',
            'x-amz-date': '20260101T000000Z',
          } })
          console.log(response.status, await response.text())
          await server.close()
          if (response.status !== 200) process.exit(1)
        "

  image:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      IMAGE: aws-kinesis-local:ci
      KINESIS_ENDPOINT: http://127.0.0.1:4567
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install test dependencies
      run: |
        npm ci
        python -m pip install -r test/clients/requirements.txt
    - name: Build the image
      run: docker build --build-arg VERSION="$(jq -r .version package.json)" -t "$IMAGE" .
    - name: Start the image
      run: |
        docker run -d --name kinesis -p 4567:4567 -e SHARDLIMIT=1000 "$IMAGE"
        timeout 60 sh -c "until curl -s -o /dev/null $KINESIS_ENDPOINT; do sleep 1; done"
    - name: Test the AWS SDK for JavaScript v3
      run: npm run test:endpoint
    - name: Test the AWS CLI
      run: sh test/clients/aws-cli.sh
    - name: Test boto3
      run: python test/clients/test_boto3.py
    - name: Show the server logs
      if: failure()
      run: docker logs kinesis
    - name: Scan the image for high and critical vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.IMAGE }}
        scanners: vuln,secret
        severity: HIGH,CRITICAL
        exit-code: "1"

  build:
    runs-on: ubuntu-latest
    needs: [test, image]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
    - name: Set Tag Name
      run: |
        RAW_REF="${{ github.head_ref || github.ref_name }}"
        # Docker image tags cannot contain '/', so replace with '-'.
        echo "TAG=${RAW_REF//\//-}" >> $GITHUB_ENV
        echo "DATE=v$(date +'%Y.%m')" >> $GITHUB_ENV
        echo "REPO_NAME=${PWD##*/}" >> $GITHUB_ENV
        echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
    - name: Login to DockerHub
      uses: docker/login-action@v4
      if: success()
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@master
      with:
        platforms: all
    - name: Set up Docker Buildx
      id: buildx
      if: success()
      uses: docker/setup-buildx-action@v4
      env:
        DOCKER_BUILDKIT: 1
    - name: Build and push Docker image - (TAG)
      uses: docker/build-push-action@v7
      if: success()
      env:
        DOCKER_BUILDKIT: 1
      with:
        context: .
        file: ./Dockerfile
        build-args: VERSION=${{ env.VERSION }}
        platforms: linux/amd64,linux/arm64
        pull: true
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO_NAME }}:${{ env.TAG == 'main' && 'latest' || env.TAG }}
    - name: Build and push Docker image - (MAIN)
      uses: docker/build-push-action@v7
      if: ${{ contains(github.ref, 'main') }}
      env:
        DOCKER_BUILDKIT: 1
      with:
        context: .
        file: ./Dockerfile
        build-args: VERSION=${{ env.VERSION }}
        platforms: linux/amd64,linux/arm64
        pull: true
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO_NAME }}:${{ env.DATE }}
    - name: Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      if: success()
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO_NAME }}:${{ env.TAG == 'main' && 'latest' || env.TAG }}
        format: 'template'
        template: '@/contrib/sarif.tpl'
        output: 'trivy-results.sarif'
    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: success()
      with:
        sarif_file: 'trivy-results.sarif'

  k8s-test:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ ! contains(github.ref, 'main') }}
    steps:
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.15.1
        with:
          verbosity: "10"
          kubectl_version: "v1.29.3"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run K8s test
        run: |
          kubectl version
          export NS=`cat deployment/kustomization.yml  | grep namespace | awk '{ print $2 }'`
          if [ -z "$NS" ]; then
            export NS='data'
          fi
          kubectl create namespace $NS
          kubectl apply -n $NS -k deployment/

          helm install kinesis charts/kinesis --namespace kinesis --create-namespace

          kubectl get all -A
          helm list -A

  auto-approve:
    runs-on: ubuntu-latest
    needs: [build, k8s-test]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Auto Approve PR
      uses: actions/github-script@v9
      with:
       script: |
        github.rest.pulls.createReview({
          owner: context.repo.owner,
          repo: context.repo.repo,
          pull_number: context.issue.number,
          event: "APPROVE"
        })

  auto-preview:
    runs-on: ubuntu-latest
    needs: [auto-approve]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Add Preview Label
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['preview']
          })
