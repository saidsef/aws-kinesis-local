name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "model/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
      published: ${{ steps.version.outputs.published }}
      pushed: ${{ steps.version.outputs.pushed }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Compare the version with the tags, npm and Docker Hub
        id: version
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/$GITHUB_REPOSITORY/tags/$VERSION")
          case "$STATUS" in
            200) echo "pushed=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "pushed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Docker Hub answered HTTP $STATUS for the tag $VERSION."; exit 1 ;;
          esac

  verify:
    runs-on: ubuntu-latest
    needs: [version]
    if: ${{ needs.version.outputs.tagged == 'false' || needs.version.outputs.published == 'false' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build the image
        run: docker build --build-arg VERSION="${{ needs.version.outputs.version }}" -t aws-kinesis-local:release .
      - name: Cache Maven packages for the Kinesis Client Library test
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kcl-m2
          key: kcl-m2-${{ hashFiles('test/kcl/pom.xml') }}
      - name: Test the Kinesis Client Library
        run: IMAGE=aws-kinesis-local:release MAVEN_CACHE="$RUNNER_TEMP/kcl-m2" sh test/kcl/run.sh

  release:
    runs-on: ubuntu-latest
    needs: [version, verify]
    if: ${{ needs.version.outputs.tagged == 'false' }}
    permissions:
      contents: write
    steps:
      - name: Create the tag and the GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: v${{ needs.version.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo
            const tag = process.env.TAG
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha })
            } catch (error) {
              if (error.status !== 422) throw error
              core.info(`Tag ${tag} already exists, so it stays where it is.`)
            }
            try {
              await github.rest.repos.createRelease({ owner, repo, tag_name: tag, generate_release_notes: true })
            } catch (error) {
              if (error.status !== 422) throw error
              core.info(`Release ${tag} already exists.`)
            }

  npm:
    runs-on: ubuntu-latest
    needs: [version, verify, release]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.release.result != 'failure' && needs.version.outputs.published == 'false' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Publish through the trusted publisher
        run: npm publish

  image:
    runs-on: ubuntu-latest
    needs: [version, verify, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.verify.result != 'failure' && needs.release.result != 'failure' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout the release tag
        if: ${{ needs.version.outputs.pushed == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Read the commit and the build time
        if: ${{ needs.version.outputs.pushed == 'false' }}
        run: |
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up QEMU
        if: ${{ needs.version.outputs.pushed == 'false' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push the version tag
        if: ${{ needs.version.outputs.pushed == 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.revision=${{ env.REVISION }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
      - name: Point latest and the minor and major tags at the version
        if: ${{ !contains(needs.version.outputs.version, '-') }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          for TAG in latest "${VERSION%.*}" "${VERSION%%.*}"; do
            CURRENT=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) || CURRENT=""
            if [ "$CURRENT" = "$DIGEST" ]; then
              echo "$TAG already points at $DIGEST."
            else
              docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
            fi
          done
