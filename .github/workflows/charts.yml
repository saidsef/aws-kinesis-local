name: Charts

on:
  push:
    branches:
      - main
    paths:
      - charts/**
  pull_request:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:

jobs:
  chart:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || contains(github.ref, 'main') }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Helm lint
        run: helm lint charts/kinesis
      - name: Check that the chart and Kustomize versions match package.json
        run: node scripts/check-versions.ts
      - name: Check chart README
        run: |
          docker run --rm --volume "$PWD:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2
          if ! git diff --exit-code -- charts/kinesis/README.md; then
            echo "::error file=charts/kinesis/README.md::The chart README is out of date. Run helm-docs and commit the result."
            exit 1
          fi
      - name: Lint the chart with chart-testing
        if: ${{ github.event_name == 'pull_request' }}
        # git in the container runs as root and refuses a checkout that another user owns.
        # The chart maintainer is not a GitHub username, so ct cannot validate it.
        run: |
          docker run --rm --volume "$PWD:/workdir" --workdir /workdir quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /workdir && ct lint --target-branch main --chart-dirs charts --validate-maintainers=false'
      - name: Configure Git
        if: ${{ contains(github.ref, 'main') }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Copy Readme and License
        if: ${{ contains(github.ref, 'main') }}
        run: |
          cp -v LICENSE.md CONTRIBUTING.md charts/kinesis/
      - name: Run chart-releaser
        if: ${{ contains(github.ref, 'main') }}
        uses: helm/chart-releaser-action@v1.8.0
        with:
          charts_dir: charts
          config: charts/cr.yml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  k8s-test:
    runs-on: ubuntu-latest
    needs: [chart]
    if: ${{ ! contains(github.ref, 'main') }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Create k8s Kind Cluster
        run: kind create cluster --wait 60s
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install the chart
        run: helm install kinesis charts/kinesis --namespace kinesis --create-namespace --wait --timeout 5m
      - name: Test the chart
        run: helm test kinesis --namespace kinesis --timeout 5m
      - name: Show the cluster state
        if: failure()
        run: |
          kubectl get all --all-namespaces
          kubectl describe pods --all-namespaces --selector app.kubernetes.io/name=kinesis
          helm list --all-namespaces

  auto-approve:
    runs-on: ubuntu-latest
    needs: [chart, k8s-test]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Auto Approve PR
      uses: actions/github-script@v9
      with:
       script: |
        github.rest.pulls.createReview({
          owner: context.repo.owner,
          repo: context.repo.repo,
          pull_number: context.issue.number,
          event: "APPROVE"
        })
