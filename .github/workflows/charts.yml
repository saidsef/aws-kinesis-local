name: Charts

on:
  push:
    branches:
      - main
    paths:
      - charts/**
  pull_request:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:

jobs:
  chart:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || contains(github.ref, 'main') }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Helm lint
        run: helm lint charts/kinesis
      - name: Check that the chart and Kustomize versions match package.json
        run: node scripts/check-versions.ts
      - name: Check chart README
        run: |
          docker run --rm --volume "$PWD:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2
          if ! git diff --exit-code -- charts/kinesis/README.md; then
            echo "::error file=charts/kinesis/README.md::The chart README is out of date. Run helm-docs and commit the result."
            exit 1
          fi
      - name: Setup Chart Linting
        if: ${{ github.event_name == 'pull_request' }}
        id: lint
        uses: helm/chart-testing-action@v2.9.0
      - name: Configure Git
        if: ${{ contains(github.ref, 'main') }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Copy Readme and License
        if: ${{ contains(github.ref, 'main') }}
        run: |
          cp -v LICENSE.md CONTRIBUTING.md charts/kinesis/
      - name: Run chart-releaser
        if: ${{ contains(github.ref, 'main') }}
        uses: helm/chart-releaser-action@v1.8.0
        with:
          charts_dir: charts
          config: charts/cr.yml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  k8s-test:
    runs-on: ubuntu-latest
    needs: [chart]
    if: ${{ ! contains(github.ref, 'main') }}
    steps:
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.15.1
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run K8s test
        run: |
          kubectl create ns kinesis
          helm upgrade -i appsets charts/kinesis --namespace kinesis --create-namespace
          helm list -A
          kubectl get all -A
  auto-approve:
    runs-on: ubuntu-latest
    needs: [chart, k8s-test]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Auto Approve PR
      uses: actions/github-script@v9
      with:
       script: |
        github.rest.pulls.createReview({
          owner: context.repo.owner,
          repo: context.repo.repo,
          pull_number: context.issue.number,
          event: "APPROVE"
        })
