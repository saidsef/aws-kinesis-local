name: Charts

on:
  push:
    branches:
      - main
    paths:
      - charts/**
  pull_request:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || contains(github.ref, 'main') }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Helm lint
        run: helm lint charts/kinesis
      - name: Check that the chart and Kustomize versions match package.json
        run: node scripts/check-versions.ts
      - name: Check chart README
        run: |
          docker run --rm --volume "$PWD:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c
          if ! git diff --exit-code -- charts/kinesis/README.md; then
            echo "::error file=charts/kinesis/README.md::The chart README is out of date. Run helm-docs and commit the result."
            exit 1
          fi
      - name: Lint the chart with chart-testing
        if: ${{ github.event_name == 'pull_request' }}
        # git in the container runs as root and refuses a checkout that another user owns.
        # The chart maintainer is not a GitHub username, so ct cannot validate it.
        run: |
          docker run --rm --volume "$PWD:/workdir" --workdir /workdir quay.io/helmpack/chart-testing:v3.15.0@sha256:54317f2d93730ea9ca1236e3d79cd95d74110b8d733b6ab124e5829209b5f4e4 \
            sh -c 'git config --global --add safe.directory /workdir && ct lint --target-branch main --chart-dirs charts --validate-maintainers=false'

  release:
    runs-on: ubuntu-latest
    needs: [chart]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Copy Readme and License
        run: |
          cp -v LICENSE.md CONTRIBUTING.md charts/kinesis/
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: charts
          config: charts/cr.yml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  k8s-test:
    runs-on: ubuntu-latest
    needs: [chart]
    if: ${{ ! contains(github.ref, 'main') }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Create k8s Kind Cluster
        run: kind create cluster --wait 60s
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the image of a version that is not released yet
        run: |
          VERSION=$(awk -F'"' '/^appVersion:/ { print $2 }' charts/kinesis/Chart.yaml)
          IMAGE="docker.io/saidsef/aws-kinesis-local:$VERSION"
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            docker build --build-arg VERSION="$VERSION" -t "$IMAGE" .
            kind load docker-image "$IMAGE"
          fi
      - name: Install the chart
        run: helm install kinesis charts/kinesis --namespace kinesis --create-namespace --wait --timeout 5m
      - name: Test the chart
        run: helm test kinesis --namespace kinesis --timeout 5m
      - name: Show the cluster state
        if: failure()
        run: |
          kubectl get all --all-namespaces
          kubectl describe pods --all-namespaces --selector app.kubernetes.io/name=kinesis
          helm list --all-namespaces

  auto-approve:
    runs-on: ubuntu-latest
    needs: [chart, k8s-test]
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
    - name: Auto Approve PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
       script: |
        github.rest.pulls.createReview({
          owner: context.repo.owner,
          repo: context.repo.repo,
          pull_number: context.issue.number,
          event: "APPROVE"
        })

  auto-preview:
    runs-on: ubuntu-latest
    needs: [auto-approve]
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
    - name: Add Preview Label
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['preview']
          })
