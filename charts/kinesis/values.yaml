# -- StatefulSet replica count.
replicaCount: 1

image:
  # -- Image repository.
  repository: docker.io/saidsef/aws-kinesis-local
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Empty uses the chart `appVersion`, which matches the npm package version.
  tag: ""

# -- Pull secrets for private registries.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""

serviceAccount:
  # -- Whether to create a ServiceAccount.
  create: true
  # -- ServiceAccount annotations.
  annotations: {}
  # -- If empty, defaults to the fullname.
  name: ""

# -- Pod annotations.
podAnnotations: {}

# -- Pod-level securityContext.
podSecurityContext: {}
  # fsGroup: 2000

# -- Container `securityContext`: non-root, read-only rootfs, all caps dropped, seccomp RuntimeDefault.
# @default -- hardened defaults
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  runAsNonRoot: true
  runAsGroup: 65534
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Set `clusterIP: None` for headless DNS.
  headless: false
  # -- Region passed to the `helm test` aws-cli call.
  testRegion: eu-west-1

# aws-kinesis-local settings. The image entrypoint passes each variable to aws-kinesis-local as a flag.
env:
  # -- `--port`, the port that aws-kinesis-local listens on for HTTP/1.1 and HTTP/2. Also sets the container port.
  PORT: "4567"
  # -- `--path`, the directory that holds the SQLite database. The chart mounts the data volume here.
  KPATH: "/data"
  # -- `--shardLimit`, the maximum number of open shards across all provisioned streams.
  SHARDLIMIT: "50"
  # -- `--createStreamMs`, how long in milliseconds a new stream, consumer or channel stays in `CREATING`.
  CREATESTREAMMS: "50"
  # -- `--deleteStreamMs`, how long in milliseconds a deleted stream, consumer or channel stays in `DELETING`.
  DELETESTREAMMS: "50"
  # -- `--updateStreamMs`, how long in milliseconds a stream or channel stays in `UPDATING`.
  UPDATESTREAMMS: "50"

resources:
  requests:
    # -- CPU request.
    cpu: 100m
    # -- Memory request.
    memory: 512Mi
  limits:
    # -- CPU limit.
    cpu: 200m
    # -- Memory limit.
    memory: 1Gi

# -- Liveness probe spec.
# @default -- `tcpSocket port=tcp, periodSeconds=10`
livenessProbe:
  tcpSocket:
    port: tcp
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# -- Readiness probe spec.
# @default -- `tcpSocket port=tcp, periodSeconds=5`
readinessProbe:
  tcpSocket:
    port: tcp
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# -- Startup probe spec.
# @default -- `tcpSocket port=tcp, failureThreshold=30`
startupProbe:
  tcpSocket:
    port: tcp
  initialDelaySeconds: 2
  periodSeconds: 2
  failureThreshold: 30

persistence:
  # -- Back `/data` with a `volumeClaimTemplate` instead of `emptyDir`.
  enabled: false
  # -- PVC size.
  size: 1Gi
  # -- StorageClass name. Empty uses the cluster default.
  storageClass: ""
  # -- PVC access modes when persistence is enabled.
  accessModes:
    - ReadWriteOnce

podDisruptionBudget:
  # -- Render a `policy/v1 PodDisruptionBudget`.
  enabled: false
  # -- PDB `minAvailable`. Mutually exclusive with `maxUnavailable`.
  minAvailable: 1
  # maxUnavailable: ""

# Image used by the `helm test` hook to exercise the Kinesis API.
testImage:
  # -- helm-test image repo.
  repository: amazon/aws-cli
  # -- helm-test image tag (pinned).
  tag: "2.17.0"
  # -- Pull policy for the helm-test image.
  pullPolicy: IfNotPresent

# -- StatefulSet `revisionHistoryLimit`.
revisionHistoryLimit: 5
# -- Pod terminationGracePeriodSeconds.
terminationGracePeriodSeconds: 60

# -- Node selector.
nodeSelector: {}
# -- Pod tolerations.
tolerations: []
# -- Pod affinity rules.
affinity: {}
# -- Pod topology spread constraints.
topologySpreadConstraints: []
