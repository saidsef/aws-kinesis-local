apiVersion: v2
name: kinesis
description: A Kinesis Local Helm chart for Kubernetes
type: application
version: 0.10.0
appVersion: "1.0.1"
kubeVersion: ">= 1.32.0"
home: https://github.com/saidsef/aws-kinesis-local
icon: https://raw.githubusercontent.com/awslabs/aws-icons-for-plantuml/main/dist/MediaServices/KinesisVideoStreams2.png
keywords:
  - kinesis
  - aws
  - local
  - kubernetes
maintainers:
  - name: Said Sef
    email: saidsef@gmail.com
    url: https://saidsef.co.uk/
sources:
  - https://github.com/saidsef/aws-kinesis-local.git
annotations:
  artifacthub.io/license: "MIT"
  artifacthub.io/links: |
    - name: README
      url: https://github.com/saidsef/aws-kinesis-local/blob/main/README.md
    - name: LICENSE
      url: https://github.com/saidsef/aws-kinesis-local/blob/main/LICENSE.md
    - name: CONTRIBUTING
      url: https://github.com/saidsef/aws-kinesis-local/blob/main/CONTRIBUTING.md
  artifacthub.io/changes: |
    - kind: fixed
      description: podSecurityContext defaults to fsGroup 65534 with fsGroupChangePolicy OnRootMismatch, so aws-kinesis-local can open its database on a persistent volume that root owns
    - kind: changed
      description: The PodDisruptionBudget defaults to maxUnavailable 1 instead of minAvailable 1, so it no longer blocks a node drain with a single replica
    - kind: changed
      description: The PodDisruptionBudget carries only minAvailable when minAvailable is set, and maxUnavailable otherwise
    - kind: fixed
      description: With service.headless set, the helm test pod calls the container port, because only that port answers on the pod addresses
    - kind: removed
      description: The StatefulSet drops the npm cache volume at /.npm, which the image does not use
    - kind: changed
      description: The replicaCount description says that replicas do not share streams
