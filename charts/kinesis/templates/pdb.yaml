{{- if .Values.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kinesis.fullname" . }}
  labels:
    {{- include "kinesis.labels" . | nindent 4 }}
spec:
  {{- $min := .Values.podDisruptionBudget.minAvailable }}
  {{- $max := .Values.podDisruptionBudget.maxUnavailable }}
  {{- if not (or (kindIs "invalid" $min) (eq (toString $min) "")) }}
  minAvailable: {{ $min }}
  {{- else if not (or (kindIs "invalid" $max) (eq (toString $max) "")) }}
  maxUnavailable: {{ $max }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kinesis.selectorLabels" . | nindent 6 }}
{{- end }}
