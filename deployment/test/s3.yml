---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  labels:
    app.kubernetes.io/name: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: seaweedfs
          image: docker.io/chrislusf/seaweedfs:4.53
          args: ["server", "-s3", "-master.volumeSizeLimitMB=64"]
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 50m
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  labels:
    app.kubernetes.io/name: s3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: s3
  ports:
    - name: s3
      port: 8333
      protocol: TCP
      targetPort: s3
