---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kinesis
spec:
  template:
    spec:
      containers:
        - name: kinesis
          env:
            - name: S3ENDPOINT
              value: http://s3:8333
            - name: DELIVERYINTERVALMS
              value: "2000"
            - name: LOGLEVEL
              value: info
            - name: S3_ACCESS_KEY_ID
              value: test
            - name: S3_SECRET_ACCESS_KEY
              value: test
