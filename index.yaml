  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: podSecurityContext defaults to fsGroup 65534 with fsGroupChangePolicy OnRootMismatch, so aws-kinesis-local can open its database on a persistent volume that root owns
        - kind: changed
          description: The PodDisruptionBudget defaults to maxUnavailable 1 instead of minAvailable 1, so it no longer blocks a node drain with a single replica
        - kind: changed
          description: The PodDisruptionBudget carries only minAvailable when minAvailable is set, and maxUnavailable otherwise
        - kind: fixed
          description: With service.headless set, the helm test pod calls the container port, because only that port answers on the pod addresses
        - kind: removed
          description: The StatefulSet drops the npm cache volume at /.npm, which the image does not use
        - kind: changed
          description: The replicaCount description says that replicas do not share streams
      artifacthub.io/license: MIT
      artifacthub.io/links: |
