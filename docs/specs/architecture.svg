<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">aws-kinesis-local architecture</title>
  <desc id="diagram-desc">AWS clients send JSON or CBOR over HTTP/1.1 or HTTP/2, with or without TLS, on the same port. The listener passes each connection to the matching server. The request handler validates each request against the generated model, runs the operation and returns the result. The operations use the store, which keeps its data in SQLite.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .heading { font-size: 22px; font-weight: 700; }
    .subheading { font-size: 15px; fill: #57606a; }
    .name { font-size: 15px; font-weight: 700; }
    .brand { font-size: 15px; font-weight: 700; fill: #00796b; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #00695c; }
    .body { font-size: 13px; }
    .muted { font-size: 13px; fill: #57606a; }
    .small { font-size: 12.5px; fill: #57606a; }
    .middle { text-anchor: middle; }
    .end { text-anchor: end; }
    .frame { fill: #f3faf9; stroke: #00897b; stroke-width: 1.5; }
    .core { fill: #e0f2f1; stroke: #00897b; stroke-width: 1.5; }
    .support { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
    .client { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
    .note { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .build { fill: #ffffff; stroke: #57606a; stroke-width: 1.25; stroke-dasharray: 7 5; }
    .flow { fill: none; stroke: #1f2328; stroke-width: 1.5; }
    .flow-build { fill: none; stroke: #57606a; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .flow-note { fill: none; stroke: #f9a825; stroke-width: 1.5; stroke-dasharray: 2 4; }
    .icon { fill: none; stroke: #00796b; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .database { fill: #e0f2f1; stroke: #00897b; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f2328"/>
    </marker>
    <marker id="arrow-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <g id="icon-terminal" class="icon"><rect x="1.5" y="3" width="21" height="18" rx="3"/><path d="M6 9l4 3-4 3M12 16h6"/></g>
    <g id="icon-code" class="icon"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/></g>
    <g id="icon-layers" class="icon"><path d="M12 2.5l9.5 5-9.5 5-9.5-5zM2.5 12.5l9.5 5 9.5-5M2.5 17l9.5 5 9.5-5"/></g>
    <g id="icon-check" class="icon"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 12.5l3.5 3.5L17 8.5"/></g>
    <g id="icon-start" class="icon"><path d="M7 3.5l13.5 8.5L7 20.5z"/></g>
    <g id="icon-lock" class="icon"><rect x="4" y="11" width="16" height="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g>
    <g id="icon-clock" class="icon"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2.5"/></g>
    <g id="icon-gear" class="icon"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></g>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="1099" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text class="heading" x="40" y="44">aws-kinesis-local architecture</text>
  <text class="subheading" x="40" y="70">How a request travels from an AWS client to SQLite.</text>

  <g>
    <rect class="client" x="40" y="92" width="190" height="92" rx="8"/>
    <use href="#icon-terminal" x="123" y="102"/>
    <text class="name middle" x="135" y="148">AWS CLI</text>
    <text class="small middle" x="135" y="168">aws kinesis commands</text>

    <rect class="client" x="250" y="92" width="190" height="92" rx="8"/>
    <use href="#icon-code" x="333" y="102"/>
    <text class="name middle" x="345" y="148">AWS SDKs</text>
    <text class="small middle" x="345" y="168">JavaScript v3, Java, boto3</text>

    <rect class="client" x="460" y="92" width="190" height="92" rx="8"/>
    <use href="#icon-layers" x="543" y="102"/>
    <text class="name middle" x="555" y="148">Kinesis Client Library</text>
    <text class="small middle" x="555" y="168">Polling and enhanced fan-out</text>

    <rect class="client" x="670" y="92" width="190" height="92" rx="8"/>
    <use href="#icon-check" x="753" y="102"/>
    <text class="name middle" x="765" y="148">Node.js test suites</text>
    <text class="small middle" x="765" y="168">Run a server with start()</text>
  </g>

  <rect class="frame" x="40" y="232" width="820" height="708" rx="12"/>
  <text class="brand" x="64" y="262">aws-kinesis-local</text>
  <text class="muted" x="64" y="282">A single Node.js process with no runtime npm dependencies</text>

  <path class="flow" d="M135 184V206M345 184V206M555 184V206M765 184V206M135 206H765"/>
  <path class="flow" d="M450 206V296" marker-end="url(#arrow)"/>
  <text class="body" x="462" y="225">JSON or CBOR over HTTP/1.1 or HTTP/2, on the same port</text>

  <rect class="note" x="64" y="296" width="236" height="96" rx="8"/>
  <use href="#icon-start" transform="translate(76 306) scale(0.83)"/>
  <text class="name" x="106" y="322">Started by</text>
  <text class="body" x="78" y="346">The aws-kinesis-local command</text>
  <text class="body" x="78" y="364">The Docker image entrypoint</text>
  <text class="body" x="78" y="382">start() in the npm package</text>
  <path class="flow-note" d="M300 344H332"/>

  <rect class="core" x="332" y="296" width="236" height="96" rx="8"/>
  <text class="name middle" x="450" y="322">Listener</text>
  <text class="path middle" x="450" y="342">src/server.ts</text>
  <text class="body middle" x="450" y="362">Reads the first bytes</text>
  <text class="body middle" x="450" y="380">of each connection</text>

  <path class="flow-note" d="M568 344H600"/>
  <rect class="note" x="600" y="296" width="236" height="96" rx="8"/>
  <use href="#icon-lock" transform="translate(612 306) scale(0.83)"/>
  <text class="name" x="642" y="322">TLS connections</text>
  <text class="body" x="614" y="346">The TLS server chooses HTTP/1.1</text>
  <text class="body" x="614" y="364">or HTTP/2 through ALPN. --ssl</text>
  <text class="body" x="614" y="382">refuses plain HTTP connections.</text>

  <path class="flow" d="M450 392V412M314 412H586"/>
  <path class="flow" d="M314 412V432" marker-end="url(#arrow)"/>
  <path class="flow" d="M586 412V432" marker-end="url(#arrow)"/>
  <text class="muted end" x="300" y="425">Starts with anything else</text>
  <text class="muted" x="600" y="425">Starts with the HTTP/2 preface</text>

  <rect class="core" x="196" y="432" width="236" height="72" rx="8"/>
  <text class="name middle" x="314" y="462">HTTP/1.1 server</text>
  <text class="path middle" x="314" y="484">node:http</text>

  <rect class="core" x="468" y="432" width="236" height="72" rx="8"/>
  <text class="name middle" x="586" y="462">HTTP/2 server</text>
  <text class="path middle" x="586" y="484">node:http2</text>

  <path class="flow" d="M314 504V524M586 504V524M314 524H586"/>
  <path class="flow" d="M450 524V544" marker-end="url(#arrow)"/>

  <rect class="support" x="64" y="556" width="182" height="112" rx="8"/>
  <text class="name middle" x="155" y="582">Protocol</text>
  <text class="path middle" x="155" y="602">src/protocol/</text>
  <text class="body middle" x="155" y="622">Reads and writes CBOR,</text>
  <text class="body middle" x="155" y="640">writes event streams and</text>
  <text class="body middle" x="155" y="658">serialises responses</text>
  <path class="flow" d="M270 612H246" marker-end="url(#arrow)"/>

  <rect class="core" x="270" y="544" width="360" height="136" rx="8"/>
  <text class="name middle" x="450" y="570">Request handler</text>
  <text class="path middle" x="450" y="590">src/handler.ts</text>
  <text class="body middle" x="450" y="612">Checks headers, method and content type</text>
  <text class="body middle" x="450" y="630">Parses JSON or CBOR and checks for a signature</text>
  <text class="body middle" x="450" y="648">Validates the request and runs the operation</text>
  <text class="body middle" x="450" y="666">Returns the result in the protocol of the request</text>

  <path class="flow" d="M630 612H654" marker-end="url(#arrow)"/>
  <rect class="support" x="654" y="556" width="182" height="112" rx="8"/>
  <text class="name middle" x="745" y="582">Validation</text>
  <text class="path middle" x="745" y="602">src/validation/</text>
  <text class="body middle" x="745" y="626">Checks member types</text>
  <text class="body middle" x="745" y="644">and constraints</text>

  <path class="flow" d="M450 680V716" marker-end="url(#arrow)"/>

  <rect class="support" x="64" y="716" width="182" height="88" rx="8"/>
  <text class="name middle" x="155" y="738">Kinesis helpers</text>
  <text class="path middle" x="155" y="756">src/kinesis/</text>
  <text class="body middle" x="155" y="776">Sequence numbers</text>
  <text class="body middle" x="155" y="792">and shard iterators</text>
  <path class="flow" d="M270 760H246" marker-end="url(#arrow)"/>

  <rect class="core" x="270" y="716" width="360" height="88" rx="8"/>
  <text class="name middle" x="450" y="742">Operations</text>
  <text class="path middle" x="450" y="762">src/operations/</text>
  <text class="body middle" x="450" y="784">All 45 Kinesis operations</text>

  <path class="flow" d="M745 716V668" marker-end="url(#arrow)"/>
  <rect class="support" x="654" y="716" width="182" height="88" rx="8"/>
  <text class="name middle" x="745" y="738">Generated model</text>
  <text class="path middle" x="745" y="756">src/generated/model.ts</text>
  <text class="body middle" x="745" y="776">Shapes generated from</text>
  <text class="body middle" x="745" y="792">the Smithy model</text>

  <path class="flow" d="M450 804V836" marker-end="url(#arrow)"/>

  <rect class="support" x="64" y="836" width="182" height="80" rx="8"/>
  <use href="#icon-clock" transform="translate(76 846) scale(0.75)"/>
  <text class="name" x="102" y="860">State transitions</text>
  <text class="body middle" x="155" y="884">Timers complete changes</text>
  <text class="body middle" x="155" y="902">after a set delay</text>
  <path class="flow" d="M270 876H246" marker-end="url(#arrow)"/>

  <rect class="core" x="270" y="836" width="360" height="80" rx="8"/>
  <text class="name middle" x="450" y="862">Store</text>
  <text class="path middle" x="450" y="882">src/store/</text>
  <text class="body middle" x="450" y="902">Keeps streams, records and pending changes</text>

  <path class="flow" d="M450 916V974" marker-end="url(#arrow)"/>
  <text class="muted" x="462" y="962">Synchronous calls through node:sqlite</text>

  <path class="database" d="M330 988V1058A120 14 0 0 0 570 1058V988"/>
  <ellipse class="database" cx="450" cy="988" rx="120" ry="14"/>
  <text class="name middle" x="450" y="1022">SQLite database</text>
  <text class="path middle" x="450" y="1042">aws-kinesis-local.sqlite</text>
  <text class="body middle" x="450" y="1061">Stored in --path or in memory</text>

  <rect class="support" x="64" y="976" width="182" height="96" rx="8"/>
  <text class="name" x="78" y="1000">Legend</text>
  <path class="flow" d="M78 1018H118" marker-end="url(#arrow)"/>
  <text class="body" x="128" y="1022">Call at run time</text>
  <path class="flow-build" d="M78 1040H118" marker-end="url(#arrow-build)"/>
  <text class="body" x="128" y="1044">Build output</text>
  <path class="flow-note" d="M78 1060H118"/>
  <text class="body" x="128" y="1064">Note</text>

  <path class="flow-build" d="M745 976V804" marker-end="url(#arrow-build)"/>
  <rect class="build" x="654" y="976" width="182" height="96" rx="8"/>
  <use href="#icon-gear" transform="translate(666 986) scale(0.75)"/>
  <text class="name" x="692" y="1000">Build step</text>
  <text class="path middle" x="745" y="1022">scripts/generate.ts</text>
  <text class="body middle" x="745" y="1044">Generates code from the</text>
  <text class="body middle" x="745" y="1060">Smithy model in model/</text>
</svg>
